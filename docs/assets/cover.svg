<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="460" viewBox="0 0 1280 460"><title>CityBuddy — Commerce and identity</title><desc>Transaction correctness, concurrency and recovery.</desc><rect width="1280" height="460" rx="14" fill="#f7f3ea"/><path d="M48 78H1232M48 401H1232" stroke="#ddd6c6"/><text x="50" y="46" font-size="12" fill="#272821" font-family="Helvetica,Arial,sans-serif" letter-spacing="2.1" style="fill:#7b776b">CITYBUDDY / TRANSACTIONS</text><text x="48" y="168" font-size="70" fill="#272821" font-family="Georgia,Times New Roman,serif">CityBuddy.</text><text x="51" y="226" font-size="30" fill="#272821" font-family="Georgia,Times New Roman,serif">Every write has a consequence.</text><text x="52" y="280" font-size="13" fill="#272821" font-family="Helvetica,Arial,sans-serif">Commerce &amp; identity, from admission to durable receipt.</text><text x="52" y="338" font-size="13" fill="#272821" font-family="Helvetica,Arial,sans-serif">Java · Spring Boot · MySQL · Redis · RocketMQ</text><path d="M770 246H1220" stroke="#ddd6c6" stroke-width="2"/><rect x="738" y="163" width="124" height="166" rx="12" fill="#fffdf8" stroke="#ddd6c6"/><text x="800" y="210" font-size="36" fill="#272821" font-family="Georgia,Times New Roman,serif" text-anchor="middle" style="fill:#b63a2b">01</text><text x="800" y="303" font-size="11" fill="#272821" font-family="Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.5" style="fill:#7b776b">ADMIT</text><path d="M785 246l10 10 21-24" fill="none" stroke="#b63a2b" stroke-width="2"/><rect x="912" y="163" width="124" height="166" rx="12" fill="#272821" stroke="#272821"/><text x="974" y="210" font-size="36" fill="#272821" font-family="Georgia,Times New Roman,serif" text-anchor="middle" style="fill:#f7f3ea">02</text><text x="974" y="303" font-size="11" fill="#272821" font-family="Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.5" style="fill:#f7f3ea">COMMIT</text><path d="M959 246l10 10 21-24" fill="none" stroke="#e4d4b5" stroke-width="2"/><rect x="1086" y="163" width="124" height="166" rx="12" fill="#fffdf8" stroke="#ddd6c6"/><text x="1148" y="210" font-size="36" fill="#272821" font-family="Georgia,Times New Roman,serif" text-anchor="middle" style="fill:#b63a2b">03</text><text x="1148" y="303" font-size="11" fill="#272821" font-family="Helvetica,Arial,sans-serif" text-anchor="middle" letter-spacing="1.5" style="fill:#7b776b">REPLAY</text><path d="M1133 246l10 10 21-24" fill="none" stroke="#b63a2b" stroke-width="2"/><text x="747" y="127" font-size="12" fill="#272821" font-family="Helvetica,Arial,sans-serif" letter-spacing="2.1" style="fill:#7b776b">ONE INTENT. ONE BUSINESS RESULT.</text><text x="50" y="432" font-size="12" fill="#272821" font-family="Helvetica,Arial,sans-serif" letter-spacing="2.1" style="fill:#7b776b">CONCURRENCY / CONSISTENCY / RECOVERY</text><text x="1230" y="432" font-size="11" fill="#272821" font-family="Helvetica,Arial,sans-serif" text-anchor="end" letter-spacing="2">SHOPMATE / CITYBUDDY / STATEEVAL</text></svg>

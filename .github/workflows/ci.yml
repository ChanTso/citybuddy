name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Java toolchain
        run: make setup-java
      - name: Run Java checks
        run: make java-ci

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install Python toolchain
        run: make setup-python
      - name: Run Python checks
        run: make python-ci

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.17.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web toolchain
        run: make setup-web
      - name: Run web checks
        run: make web-ci

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install repository toolchain
        run: make setup-repo
      - name: Run repository checks
        run: make repo-ci

  integration:
    name: integration (${{ matrix.lane || matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-runtime-integration
            java: false
            python: false
            timeout_minutes: 30
          - target: test-mysql-integration
            java: false
            python: false
            timeout_minutes: 30
          - target: test-identity-integration
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-identity-integration
            java: true
            python: true
            timeout_minutes: 30
          # This suite executes complete production/evaluation physical-column single/pair matrices.
          # Those matrices are 3,080 independent mutate/probe/restore cells and about seven eighths
          # of its runtime, so CI divides the probing across shards. Every shard runs the full
          # lifecycle and enumerates the whole matrix; only the expensive per-cell probe is split.
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 0 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 0
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 1 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 1
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 2 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 2
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 3 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 3
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 4 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 4
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 5 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 5
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 6 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 6
            java: true
            python: true
            timeout_minutes: 30
          - target: test-evaluation-sandbox-integration
            lane: test-evaluation-sandbox-integration shard 7 of 8
            payment_matrix_shards: 8
            payment_matrix_shard: 7
            java: true
            python: true
            timeout_minutes: 30
          - target: test-catalog-integration
            java: true
            python: true
            timeout_minutes: 30
          - target: test-redis-integration
            java: false
            python: false
            timeout_minutes: 30
          - target: test-elasticsearch-integration
            java: false
            python: false
            timeout_minutes: 30
          - target: test-knowledge-search-integration
            java: false
            python: true
            timeout_minutes: 30
          - target: test-retrieval-evidence-integration
            java: false
            python: true
            timeout_minutes: 30
          - target: test-rocketmq-integration
            java: false
            python: false
            timeout_minutes: 30
          - target: test-knowledge-indexer-rocketmq-spike
            java: false
            python: false
            timeout_minutes: 30
          - target: test-knowledge-sync-integration
            java: false
            python: true
            timeout_minutes: 30
          - target: test-knowledge-rebuild-integration
            java: true
            python: true
            timeout_minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - if: matrix.java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: matrix.python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - if: matrix.python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - if: matrix.java
        name: Install Java toolchain
        run: make setup-java
      - if: matrix.python
        name: Install Python toolchain
        run: make setup-python
      - name: Run integration suite
        env:
          SANDBOX_PAYMENT_MATRIX_SHARDS: ${{ matrix.payment_matrix_shards }}
          SANDBOX_PAYMENT_MATRIX_SHARD: ${{ matrix.payment_matrix_shard }}
        run: make ${{ matrix.target }}

  ci:
    if: always()
    needs: [java, python, web, repository, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        env:
          JAVA_RESULT: ${{ needs.java.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          for result in \
            "$JAVA_RESULT" \
            "$PYTHON_RESULT" \
            "$WEB_RESULT" \
            "$REPOSITORY_RESULT" \
            "$INTEGRATION_RESULT"; do
            test "$result" = success
          done
